schema_version: "1.0"
graph_id: graph-orders
contract:
  schema_version: "1.0"
  contract_id: contract-orders
  revision: 1
entry_node_id: implement
nodes:
  - schema_version: "1.0"
    node_id: implement
    node_type: agent
    objective: Implement the frozen task contract
    config:
      role: implementer
  - schema_version: "1.0"
    node_id: verify
    node_type: verifier
    objective: Run the frozen verifier
    config:
      verifier_ref: unit-tests
  - schema_version: "1.0"
    node_id: deliver
    node_type: delivery
    objective: Prepare a patch and report
edges:
  - schema_version: "1.0"
    from_node: implement
    to_node: verify
  - schema_version: "1.0"
    from_node: verify
    to_node: deliver
    condition:
      schema_version: "1.0"
      field: result.status
      operator: equals
      value: passed
