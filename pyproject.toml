[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-engineering"
version = "0.7.0"
description = "Provider-neutral graph runtime with local service, MCP, and versioned delivery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Graph Engineering contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
ge = "graph_engineering.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -p no:cacheprovider --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = ["real_codex: explicitly enabled real Codex CLI acceptance test"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["graph_engineering"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
